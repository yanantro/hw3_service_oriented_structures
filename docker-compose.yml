services:
  flight-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flight
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
    ports:
      - "5433:5432"
    volumes:
      - flight-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flight"]
      interval: 2s
      timeout: 3s
      retries: 20

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5434:5432"
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 20

  flight-migrations:
    image: flyway/flyway:10
    command: >
      -url=jdbc:postgresql://flight-db:5432/flight
      -user=flight -password=flight
      -connectRetries=10
      migrate
    volumes:
      - ./flight_service/db/migration:/flyway/sql:ro
    depends_on:
      flight-db:
        condition: service_healthy

  booking-migrations:
    image: flyway/flyway:10
    command: >
      -url=jdbc:postgresql://booking-db:5432/booking
      -user=booking -password=booking
      -connectRetries=10
      migrate
    volumes:
      - ./booking_service/db/migration:/flyway/sql:ro
    depends_on:
      booking-db:
        condition: service_healthy

  redis-master:
    image: redis:7-alpine
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-replica:
    image: redis:7-alpine
    command: redis-server --replicaof redis-master 6379
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-sentinel:
    image: redis:7-alpine
    command: sh -c "cp /etc/redis-sentinel/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./redis/sentinel.conf:/etc/redis-sentinel/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy

  flight-service:
    build:
      context: .
      dockerfile: flight_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://flight:flight@flight-db:5432/flight
      FLIGHT_API_KEY: flight-secret-key
      REDIS_SENTINELS: redis-sentinel:26379
      REDIS_MASTER_NAME: mymaster
      CACHE_TTL_SECONDS: "300"
    ports:
      - "50051:50051"
    depends_on:
      flight-migrations:
        condition: service_completed_successfully
      redis-sentinel:
        condition: service_started

  booking-service:
    build:
      context: .
      dockerfile: booking_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://booking:booking@booking-db:5432/booking
      FLIGHT_SERVICE_ADDRESS: flight-service:50051
      FLIGHT_API_KEY: flight-secret-key
      GRPC_TIMEOUT_SECONDS: "2"
      RETRY_MAX_ATTEMPTS: "3"
      RETRY_BASE_DELAY_MS: "100"
      CB_WINDOW_SIZE: "10"
      CB_FAILURE_THRESHOLD: "5"
      CB_OPEN_SECONDS: "10"
    ports:
      - "8000:8000"
    depends_on:
      booking-migrations:
        condition: service_completed_successfully
      flight-service:
        condition: service_started

volumes:
  flight-data:
  booking-data:
